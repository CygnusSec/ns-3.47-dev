services:
  code-server:
    build:
      context: .
      dockerfile: Dockerfile.code-server
      args:
        USER_UID: "${NS3_UID:-1000}"
        USER_GID: "${NS3_GID:-1000}"
        DOCKER_GID: "${DOCKER_GID:-999}"

    image: code-server-full-dev:local
    container_name: code-server
    hostname: code-server

    restart: unless-stopped
    init: true

    environment:
      TZ: Asia/Ho_Chi_Minh
      PASSWORD: "${CODE_SERVER_PASSWORD}"
      DEFAULT_WORKSPACE: /workspace/ns-3

    working_dir: /workspace/ns-3

    ports:
      - "${CODE_SERVER_PORT:-8080}:8080"

    volumes:
      # Source ns-3 hiện tại
      - .:/workspace/ns-3

      # Cấu hình và extension code-server
      - code-server-config:/home/coder/.config
      - code-server-data:/home/coder/.local/share/code-server

      # Build artifacts dùng chung với container ns3
      - ns3-build:/workspace/ns-3/build
      - ns3-cmake-cache:/workspace/ns-3/cmake-cache
      - ns3-clion-cache-mask:/workspace/ns-3/cmake-build-debug

      # Cho phép terminal code-server điều khiển Docker host
      - /var/run/docker.sock:/var/run/docker.sock

    group_add:
      - "${DOCKER_GID:-999}"

    cap_add:
      - SYS_PTRACE

    security_opt:
      - seccomp:unconfined

    shm_size: 2gb

    networks:
      - dev-network

  ns3:
    build:
      context: .
      args:
        NS3_UID: "${NS3_UID:-1000}"
        NS3_GID: "${NS3_GID:-1000}"
    image: ns3-47-dev:local
    init: true
    stdin_open: true
    tty: true
    working_dir: /workspace/ns-3
    command: ["sleep", "infinity"]
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ports:
      # gdbserver is reachable directly through every Ubuntu host interface.
      # Restrict this port to trusted client IPs with the host/network firewall.
      - "0.0.0.0:${NS3_GDB_PORT:-2345}:2345"
    volumes:
      - .:/workspace/ns-3
      - ns3-ccache:/home/ns3/.cache/ccache
      - ns3-build:/workspace/ns-3/build
      - ns3-cmake-cache:/workspace/ns-3/cmake-cache
      - ns3-clion-cache-mask:/workspace/ns-3/cmake-build-debug
    networks:
      - dev-network

volumes:
  code-server-config:
  code-server-data:
  ns3-ccache:
  ns3-build:
  ns3-cmake-cache:
  ns3-clion-cache-mask:

networks:
  dev-network:
    name: ns3-dev-network
